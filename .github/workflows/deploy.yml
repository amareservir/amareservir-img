name: Deploy Amar e Servir

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy no servidor
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            echo "========================================"
            echo "=== DEPLOY AMAR E SERVIR API ==="
            echo "========================================"

            cd /opt/projects/amareservir/oficial/amareservir-api

            echo "=== Git Pull ==="
            git pull origin main

            echo "=== Docker Down ==="
            docker compose down

            echo "=== Docker Build e Start ==="
            docker compose up -d --build

            echo "=== Status API ==="
            docker compose ps

            echo "=== Deploy concluído Amar e Servir API ==="

            echo ""
            echo "========================================"
            echo "=== DEPLOY AMAR E SERVIR WEB ==="
            echo "========================================"

            cd /opt/projects/amareservir/oficial/amareservir-web

            echo "=== Git Pull ==="
            git pull origin main

            echo "=== Docker Down ==="
            docker compose down

            echo "=== Docker Build e Start ==="
            docker compose up -d --build

            echo "=== Status WEB ==="
            docker compose ps

            echo "=== Deploy concluído Amar e Servir Web ==="

            echo ""
            echo "========================================"
            echo "=== DEPLOY FINALIZADO COM SUCESSO ==="
            echo "========================================"